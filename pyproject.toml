[project]
name = "lob-predictor"
version = "0.1.0"
description = "Probabilistic short-term price movement prediction from order book microstructure (BTCUSDT)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "rajo"},
]

dependencies = [
    # Data collection
    "websockets>=13.0",
    "orjson>=3.10",
    "httpx>=0.27",
    "sortedcontainers>=2.4",
    # Storage
    "pyarrow>=17.0",
    # Data processing
    "pandas>=2.2",
    "numpy>=1.26",
    # Machine learning
    "scikit-learn>=1.5",
    "lightgbm>=4.4",
    "xgboost>=2.1",
    "optuna>=4.0",
    # Deep learning
    "torch>=2.3",
    # Explainability
    "shap>=0.45",
    # Visualization
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Deployment
    "gradio>=5.0",
    # Monitoring
    "scipy>=1.13",
    # Config
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # Logging
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
executionEnvironments = [
  { root = "." }
]
